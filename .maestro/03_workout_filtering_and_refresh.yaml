appId: com.skycherepanya.Lifecore
---
# Flow 03: Workouts Category Filtering & HealthKit Telemetry Refresh
- launchApp:
    clearState: false
    arguments:
      LifecoreFixtureMode: "true"
      LifecoreFixtureScenario: "seeded"

# 1. Switch to Workouts Tab
- tapOn:
    id: "tab_workouts"

- assertVisible:
    id: "btn_refresh_workouts"

# 2. Scroll to & Cycle Through Activity Filters
- scrollUntilVisible:
    element:
      id: "filter_workout_all"
    direction: DOWN

- assertVisible:
    id: "filter_workout_all"

- tapOn:
    id: "filter_workout_running"

- tapOn:
    id: "filter_workout_strength"

- tapOn:
    id: "filter_workout_all"

# 3. Trigger Workout Telemetry Refresh
- tapOn:
    id: "btn_refresh_workouts"

- assertVisible:
    id: "tab_workouts"
