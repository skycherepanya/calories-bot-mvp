name: iOS Tests and Maestro E2E

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.maestro/**'
      - 'scripts/run_e2e.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.maestro/**'
      - 'scripts/run_e2e.sh'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-e2e:
    name: Native Verification & Maestro E2E Suite
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode and Assert SDK Compatibility
        run: |
          if [[ -d "/Applications/Xcode.app/Contents/Developer" ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          elif [[ -d "/Applications/Xcode_16.0.app/Contents/Developer" ]]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version || true)
          echo "Discovered iPhoneSimulator SDK version: ${SDK_VERSION:-none}"
          MAJOR_SDK=$(echo "${SDK_VERSION:-0}" | cut -d'.' -f1)

          if [[ -z "$SDK_VERSION" ]] || [[ "$MAJOR_SDK" -lt 27 ]]; then
            echo "::notice::Runner SDK version (${SDK_VERSION:-none}) is below the required iOS 27 floor. Skipping simulator tests on unsupported cloud host."
            echo "SKIP_TESTS=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_TESTS=false" >> "$GITHUB_ENV"
          fi

      - name: Run Native Unit Tests (LifecoreTests)
        if: env.SKIP_TESTS != 'true'
        run: |
          xcodebuild -project ios/Lifecore/Lifecore/Lifecore.xcodeproj \
                     -scheme Lifecore \
                     -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
                     test CODE_SIGNING_ALLOWED=NO

      - name: Install Maestro CLI
        if: env.SKIP_TESTS != 'true'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run E2E Test Suite
        if: env.SKIP_TESTS != 'true'
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          ./scripts/run_e2e.sh .maestro/suite.yaml
