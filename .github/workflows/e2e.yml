name: iOS Maestro E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.maestro/**'
      - 'scripts/run_e2e.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.maestro/**'
      - 'scripts/run_e2e.sh'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-simulator:
    name: Maestro E2E Suite
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run E2E Test Suite
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          ./scripts/run_e2e.sh .maestro/suite.yaml
